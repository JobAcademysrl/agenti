<!doctype html><html><head><meta charset="utf-8"><style>
body { margin: 0; width: 1200px; height: 630px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; overflow: hidden;
  background: radial-gradient(70% 90% at 12% 8%, #6fa0ff 0%, transparent 60%), radial-gradient(60% 80% at 95% 100%, var(--c2, #6b55e6) 0%, transparent 60%), #000; }
.wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 28px; }
.mark { width: 56px; height: 56px; border-radius: 16px; background: #fff; color: #000; display: grid; place-items: center; font-size: 20px; letter-spacing: .02em; }
.kicker { font-size: 22px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #cfe0ff; margin-bottom: 18px; }
h1 { margin: 0; font-size: 84px; line-height: 1; font-weight: 600; letter-spacing: -.03em; max-width: 15ch; }
.pills { display: flex; gap: 14px; }
.pill { padding: 14px 22px; border-radius: 18px; background: #ffffff1f; border: 1px solid #ffffff33; font-size: 22px; }
.pill b { display: block; font-size: 30px; }
</style></head><body><div class="wrap">
<div class="brand"><span class="mark" id="mark">MIA</span><span id="brand">Job Academy · Piattaforma MIA</span></div>
<div><div class="kicker" id="kicker">Riservato agli agenti</div><h1 id="title">Proponi il microcredito in 15 minuti</h1></div>
<div class="pills" id="pills"><div class="pill"><b>Formula VIA</b>chiavi in mano</div><div class="pill"><b>500 €</b>per cliente che paga</div><div class="pill"><b>−200 €</b>porta un amico</div></div>
</div></body></html>
